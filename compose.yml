name: nextcloud

include:
  - build.yml

services:
  server:
    image: infra7/nextcloud:${NEXTCLOUD_VERSION:-latest}
    restart: unless-stopped
    environment:
      SQLITE_DATABASE: nextcloud
      NEXTCLOUD_ADMIN_USER_FILE: /run/secrets/admin_user
      NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/admin_pass
    healthcheck:
      test: nc -zv 127.0.0.1 9000 || exit -1
      interval: 30s
      retries: 3
      start_period: 10s
      timeout: 3s
    secrets:
      - admin_pass
      - admin_user
    volumes:
      - ${PWD}/config/app:/var/www/html/config
      - ${DATADIR:-${PWD}/storage}/webdata:/var/www/html
      - ${DATADIR:-${PWD}/storage}/apps:/var/www/html/custom_apps
      - ${DATADIR:-${PWD}/storage}/data:/var/www/html/data
      - ${DATADIR:-${PWD}/storage}/theme:/var/www/html/themes/custom
      - ${DATADIR:-${PWD}/storage}/skeleton:/var/www/html/data/skeleton
      - /run/postgresql:/run/postgresql

  cron:
    image: infra7/nextcloud:${NEXTCLOUD_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      - server
    entrypoint: /cron.sh
    healthcheck:
      test: pidof busybox || exit -1
      start_period: 10s
      interval: 30s
      timeout: 3s
      retries: 3
    volumes_from:
      - server

  web:
    image: nginx:${NGINX_VERSION:-stable}-alpine-slim
    restart: unless-stopped
    healthcheck:
      test: nc -v -w 1 -z 127.0.0.1 80
      start_period: 15s
      interval: 10s
      timeout: 3s
      retries: 3
    hostname: nextcloud
    links:
      - server
    volumes:
      - ${PWD}/config/web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PWD}/config/web/mime.types:/etc/nginx/mime.types:ro
    volumes_from:
      - server

secrets:
  admin_pass:
    file: ${PWD}/secrets/nextcloud.passwd
  admin_user:
    file: ${PWD}/secrets/nextcloud.admin

networks:
  default:
    name: nextcloud
